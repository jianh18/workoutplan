<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Training Checklist</title>
  <style>
    :root {
      --bg:#07111f; --card:#0f1c2e; --card2:#132238; --text:#f8fafc; --muted:#94a3b8;
      --line:#24364e; --accent:#38bdf8; --good:#22c55e; --warn:#f59e0b; --danger:#ef4444;
      --shadow:0 10px 30px rgba(0,0,0,.22);
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(180deg,#07111f,#0a1423 45%,#07111f);color:var(--text);min-height:100vh}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{max-width:860px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 92px)}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 2px 16px}
    h1{font-size:28px;line-height:1.05;margin:0 0 6px}
    .sub{color:var(--muted);font-size:13px}
    .pill{border:1px solid var(--line);background:#0b1626;color:var(--text);padding:9px 12px;border-radius:999px}
    .hero{background:linear-gradient(145deg,#11233a,#0d1a2c);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
    .grid{display:grid;gap:10px}
    .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}
    input,select,textarea{width:100%;border:1px solid var(--line);background:#091525;color:var(--text);border-radius:12px;padding:11px 12px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    textarea{min-height:82px;resize:vertical}
    .section{margin:14px 0}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 3px 9px}
    .section-title h2{font-size:17px;margin:0}
    .section-title span{color:var(--muted);font-size:12px}
    .day-tabs{display:flex;gap:8px;overflow:auto;padding:2px 1px 8px;scrollbar-width:none}
    .day-tabs::-webkit-scrollbar{display:none}
    .day{flex:0 0 auto;border:1px solid var(--line);background:#0b1728;color:var(--muted);padding:10px 12px;border-radius:13px}
    .day.active{color:#00111a;background:var(--accent);border-color:var(--accent);font-weight:700}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
    .exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
    .exercise-name{font-weight:700}
    .target{font-size:12px;color:var(--muted);margin-top:3px}
    .done-chip{font-size:12px;color:var(--good)}
    .set-row{display:grid;grid-template-columns:34px 1fr 1fr 1fr 42px;gap:7px;align-items:end;margin:8px 0}
    .set-row .setno{color:var(--muted);font-size:13px;padding-bottom:11px;text-align:center}
    .mini label{display:block;color:var(--muted);font-size:10px;margin:0 0 4px}
    .mini input{padding:9px 7px;text-align:center}
    .check-wrap{display:flex;justify-content:center;align-items:center;padding-bottom:9px}
    .check{appearance:none;width:24px;height:24px;border:1px solid var(--line);border-radius:8px;background:#091525;padding:0}
    .check:checked{background:var(--good);border-color:var(--good)}
    .check:checked:after{content:"✓";display:block;text-align:center;line-height:22px;color:#052e16;font-weight:900}
    .checkline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(36,54,78,.55)}
    .checkline:last-child{border-bottom:0}
    .checkline input[type=checkbox]{width:22px;height:22px;accent-color:var(--good)}
    .checkline span{flex:1}
    .swim-set{display:grid;grid-template-columns:44px 1fr 1fr 1fr 42px;gap:7px;align-items:end;margin:7px 0}
    .metric{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
    .metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
    .metric strong{font-size:20px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#0b1728;color:var(--text);padding:10px 13px;border-radius:12px}
    .btn.primary{background:var(--accent);color:#00111a;border-color:var(--accent);font-weight:800}
    .btn.danger{border-color:#5b1d23;color:#fecaca;background:#2b1115}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(7,17,31,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);z-index:10}
    .bottom-inner{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .navbtn{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:12px}
    .navbtn.active{color:var(--text);background:#132238}
    .panel{display:none}
    .panel.active{display:block}
    .history-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
    .history-item:last-child{border-bottom:0}
    .muted{color:var(--muted)}
    .tiny{font-size:11px}
    .progress{height:8px;background:#091525;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
    .progress>div{height:100%;background:var(--good);width:0}
    .note{font-size:12px;color:var(--muted);line-height:1.45}
    @media (max-width:620px){.grid3{grid-template-columns:1fr 1fr}.set-row{grid-template-columns:30px 1fr 1fr 1fr 38px}.app{padding-left:11px;padding-right:11px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Training Checklist</h1>
      <div class="sub" id="todayLabel"></div>
    </div>
    <button class="pill" id="saveSessionBtn">保存本次</button>
  </header>

  <section id="todayPanel" class="panel active">
    <div class="hero">
      <div class="day-tabs" id="dayTabs"></div>
      <div class="grid grid3" style="margin-top:8px">
        <div class="field"><label>日期</label><input id="sessionDate" type="date"></div>
        <div class="field"><label>体重 kg</label><input data-key="pre.bodyWeight" type="number" step="0.1" inputmode="decimal"></div>
        <div class="field"><label>静息心率 bpm</label><input data-key="pre.restingHR" type="number" inputmode="numeric"></div>
        <div class="field"><label>睡眠 h</label><input data-key="pre.sleepHours" type="number" step="0.1" inputmode="decimal"></div>
        <div class="field"><label>睡眠质量 1–5</label><input data-key="pre.sleepQuality" type="number" min="1" max="5"></div>
        <div class="field"><label>精神状态 1–5</label><input data-key="pre.energy" type="number" min="1" max="5"></div>
        <div class="field"><label>肌肉酸痛 0–10</label><input data-key="pre.soreness" type="number" min="0" max="10"></div>
        <div class="field"><label>整体疲劳 0–10</label><input data-key="pre.fatigue" type="number" min="0" max="10"></div>
        <div class="field"><label>身体不适</label><input data-key="pre.discomfort" placeholder="无 / 部位"></div>
      </div>
    </div>

    <div id="workoutContainer"></div>

    <div class="section">
      <div class="section-title"><h2>Mobility</h2><span>5–10 min</span></div>
      <div class="card" id="mobilityList"></div>
    </div>

    <div class="section">
      <div class="section-title"><h2>训练结束</h2><span>Session data</span></div>
      <div class="card">
        <div class="grid grid3">
          <div class="field"><label>训练时长 min</label><input data-key="post.duration" type="number"></div>
          <div class="field"><label>Active Calories kcal</label><input data-key="post.calories" type="number"></div>
          <div class="field"><label>Avg HR bpm</label><input data-key="post.avgHR" type="number"></div>
          <div class="field"><label>Max HR bpm</label><input data-key="post.maxHR" type="number"></div>
          <div class="field"><label>Session RPE 0–10</label><input data-key="post.rpe" type="number" min="0" max="10"></div>
          <div class="field"><label>肌肉疲劳 0–10</label><input data-key="post.muscleFatigue" type="number" min="0" max="10"></div>
          <div class="field"><label>心肺疲劳 0–10</label><input data-key="post.cardioFatigue" type="number" min="0" max="10"></div>
          <div class="field"><label>关节不适 0–10</label><input data-key="post.jointPain" type="number" min="0" max="10"></div>
          <div class="field"><label>今日状态 1–5</label><input data-key="post.performance" type="number" min="1" max="5"></div>
        </div>
        <div class="field" style="margin-top:10px"><label>备注</label><textarea data-key="post.notes" placeholder="今天最好的一点 / 最大问题 / 下次调整"></textarea></div>
        <div class="actions" style="margin-top:12px">
          <button class="btn primary" id="saveBottomBtn">保存本次训练</button>
          <button class="btn" id="clearCurrentBtn">清空当前页</button>
        </div>
      </div>
    </div>
  </section>

  <section id="weekPanel" class="panel">
    <div class="hero">
      <div class="section-title" style="margin-top:0"><h2>本周概览</h2><span id="weekRange"></span></div>
      <div class="grid grid3">
        <div class="metric"><small>完成训练</small><strong id="weekSessions">0</strong></div>
        <div class="metric"><small>总训练时间</small><strong id="weekMinutes">0</strong><span class="tiny muted"> min</span></div>
        <div class="metric"><small>Active Calories</small><strong id="weekCalories">0</strong><span class="tiny muted"> kcal</span></div>
        <div class="metric"><small>游泳距离</small><strong id="weekDistance">0</strong><span class="tiny muted"> yd</span></div>
        <div class="metric"><small>平均 Session RPE</small><strong id="weekRPE">—</strong></div>
        <div class="metric"><small>平均体重</small><strong id="weekWeight">—</strong><span class="tiny muted"> kg</span></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0"><h2>本周完成率</h2><span id="weekPercent">0%</span></div>
      <div class="progress"><div id="weekProgress"></div></div>
      <div class="note" style="margin-top:10px">目标：4 次力量 + 2 次游泳，压缩在 5 个训练日完成。</div>
    </div>
  </section>

  <section id="historyPanel" class="panel">
    <div class="card">
      <div class="section-title" style="margin-top:0"><h2>训练记录</h2><span id="historyCount">0 sessions</span></div>
      <div id="historyList"></div>
    </div>
    <div class="card">
      <div class="actions">
        <button class="btn" id="exportBtn">导出 JSON</button>
        <label class="btn" for="importFile">导入 JSON</label>
        <input id="importFile" type="file" accept="application/json" style="display:none">
        <button class="btn danger" id="resetAllBtn">删除全部数据</button>
      </div>
    </div>
  </section>
</div>

<nav class="bottom">
  <div class="bottom-inner">
    <button class="navbtn active" data-panel="todayPanel">今日</button>
    <button class="navbtn" data-panel="weekPanel">本周</button>
    <button class="navbtn" data-panel="historyPanel">记录</button>
  </div>
</nav>

<script>
const templates = {
  upperA: {
    label:"Upper A", subtitle:"胸背基础力量",
    exercises:[
      ["Bench Press","3 × 6–8",3],
      ["Chest-Supported Row","3 × 8–10",3],
      ["Pull-Up / Lat Pulldown","3 × 8–12",3],
      ["Incline Dumbbell Press","3 × 8–12",3],
      ["Lateral Raise","3 × 12–20",3],
      ["Reverse Fly / Face Pull","2 × 15–20",2],
      ["Biceps Curl","2 × 10–15",2],
      ["Triceps Pushdown","2 × 10–15",2],
    ]
  },
  lowerA: {
    label:"Lower A", subtitle:"深蹲 + 后链",
    exercises:[
      ["Back Squat","3 × 5–8",3],
      ["Romanian Deadlift","3 × 6–10",3],
      ["Bulgarian Split Squat","3 × 8–10 / leg",3],
      ["Leg Curl","3 × 10–15",3],
      ["Seated Calf Raise","3 × 10–15",3],
      ["Hanging Knee Raise","3 × 10–15",3],
      ["Dead Bug","2 × 8–12 / side",2],
    ]
  },
  swimA: {
    label:"Swim A", subtitle:"技术 + 有氧",
    swim:[
      {name:"Warm-up", items:["200 yd easy freestyle","4 × 25 yd kick","4 × 25 yd technique drill"]},
      {name:"Main Set — 6 × 100 yd", sets:6, distance:100},
      {name:"Kick — 6 × 25 yd", sets:6, distance:25},
      {name:"Cooldown", items:["200 yd easy"]}
    ]
  },
  upperB: {
    label:"Upper B", subtitle:"背肩 + 增肌",
    exercises:[
      ["Pull-Up / Lat Pulldown","3 × 6–10",3],
      ["Incline Bench Press","3 × 8–10",3],
      ["Seated Cable Row","3 × 8–12",3],
      ["Dumbbell Shoulder Press","2 × 8–12",2],
      ["Pec Fly","2 × 10–15",2],
      ["Reverse Fly","3 × 12–20",3],
      ["Lateral Raise","3 × 12–20",3],
      ["Hammer Curl","2 × 10–15",2],
      ["Overhead Triceps Extension","2 × 10–15",2],
    ]
  },
  lowerB: {
    label:"Lower B + Swim B", subtitle:"腿部增肌 + 游泳速度/脚蹼",
    exercises:[
      ["Leg Press","3 × 8–12",3],
      ["Hip Thrust","3 × 8–12",3],
      ["Walking Lunge","2 × 10 / leg",2],
      ["Leg Curl","3 × 10–15",3],
      ["Standing Calf Raise","3 × 12–20",3],
      ["Pallof Press","3 × 10–15 / side",3],
    ],
    swim:[
      {name:"Warm-up", items:["200 yd easy","4 × 50 yd technique"]},
      {name:"Main Set — 8 × 50 yd", sets:8, distance:50},
      {name:"Fast Set — 4 × 25 yd", sets:4, distance:25},
      {name:"Fins / Kick — 6 × 50 yd", sets:6, distance:50}
    ]
  },
  rest:{ label:"Rest", subtitle:"恢复日" }
};
const order=["upperA","lowerA","swimA","upperB","lowerB","rest"];
const mobility=[
  "Ankle plantar flexion — 2 × 30–45 sec / side",
  "Hip flexor stretch — 2 × 30–45 sec / side",
  "Hamstring stretch — 2 × 30–45 sec / side",
  "Lat stretch — 2 × 30–45 sec / side",
  "Thoracic rotation — 8–10 / side",
  "Shoulder flexion mobility — 2 × 30 sec",
  "Relaxed diaphragmatic breathing — 2 min"
];

let currentDay = localStorage.getItem("fitness.currentDay") || dayFromWeekday();
let draft = {};
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];

function localDateISO(d=new Date()){
  const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
}
function dayFromWeekday(){
  const n=new Date().getDay();
  if(n===1) return "upperA";
  if(n===2) return "lowerA";
  if(n===3) return "swimA";
  if(n===4) return "upperB";
  if(n===6) return "lowerB";
  return "rest";
}
function draftKey(){ return `fitness.draft.${qs("#sessionDate").value}.${currentDay}`; }
function loadDraft(){
  try{ draft=JSON.parse(localStorage.getItem(draftKey())||"{}"); }catch{draft={};}
}
function saveDraft(){ localStorage.setItem(draftKey(),JSON.stringify(draft)); }
function getPath(obj,path){
  return path.split(".").reduce((a,k)=>a&&a[k]!==undefined?a[k]:undefined,obj);
}
function setPath(obj,path,val){
  const p=path.split("."); let x=obj;
  p.slice(0,-1).forEach(k=>x=x[k]||(x[k]={}));
  x[p[p.length-1]]=val;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function renderTabs(){
  qs("#dayTabs").innerHTML=order.map(k=>`<button class="day ${k===currentDay?"active":""}" data-day="${k}">${templates[k].label}</button>`).join("");
  qsa(".day").forEach(b=>b.onclick=()=>{saveAllInputs();currentDay=b.dataset.day;localStorage.setItem("fitness.currentDay",currentDay);loadDraft();render();});
}
function render(){
  renderTabs();
  renderWorkout();
  renderMobility();
  hydrateInputs();
}
function renderWorkout(){
  const t=templates[currentDay]; let html=`<div class="section"><div class="section-title"><h2>${t.label}</h2><span>${t.subtitle}</span></div>`;
  if(t.exercises){
    t.exercises.forEach((e,i)=>{
      html+=`<div class="card"><div class="exercise-head"><div><div class="exercise-name">${e[0]}</div><div class="target">${e[1]}</div></div><div class="done-chip" id="done-${i}"></div></div>`;
      for(let s=0;s<e[2];s++){
        html+=`<div class="set-row">
          <div class="setno">${s+1}</div>
          <div class="mini"><label>重量 lb</label><input data-key="ex.${i}.sets.${s}.weight" type="number" step="0.5"></div>
          <div class="mini"><label>Reps</label><input data-key="ex.${i}.sets.${s}.reps" type="number"></div>
          <div class="mini"><label>RIR</label><input data-key="ex.${i}.sets.${s}.rir" type="number" min="0" max="5"></div>
          <div class="check-wrap"><input class="check" data-key="ex.${i}.sets.${s}.done" type="checkbox"></div>
        </div>`;
      }
      html+=`</div>`;
    });
  }
  if(t.swim){
    html+=`<div class="section-title"><h2>Swim</h2><span>正常呼吸训练</span></div>`;
    t.swim.forEach((block,b)=>{
      html+=`<div class="card"><div class="exercise-name">${block.name}</div>`;
      if(block.items){
        block.items.forEach((it,j)=>html+=`<label class="checkline"><input type="checkbox" data-key="swim.${b}.items.${j}.done"><span>${it}</span></label>`);
      }
      if(block.sets){
        for(let s=0;s<block.sets;s++){
          html+=`<div class="swim-set">
            <div class="setno">${s+1}</div>
            <div class="mini"><label>Time sec</label><input data-key="swim.${b}.sets.${s}.time" type="number" step="0.1"></div>
            <div class="mini"><label>Avg HR</label><input data-key="swim.${b}.sets.${s}.hr" type="number"></div>
            <div class="mini"><label>RPE</label><input data-key="swim.${b}.sets.${s}.rpe" type="number" min="0" max="10"></div>
            <div class="check-wrap"><input class="check" data-key="swim.${b}.sets.${s}.done" type="checkbox"></div>
          </div>`;
        }
      }
      html+=`</div>`;
    });
    html+=`<div class="card"><div class="grid grid3">
      <div class="field"><label>总距离 yd</label><input data-key="swimSummary.distance" type="number"></div>
      <div class="field"><label>总时间 min</label><input data-key="swimSummary.time" type="number" step="0.1"></div>
      <div class="field"><label>Avg pace /100 yd</label><input data-key="swimSummary.pace" placeholder="自动/手填"></div>
      <div class="field"><label>Avg HR bpm</label><input data-key="swimSummary.avgHR" type="number"></div>
      <div class="field"><label>Max HR bpm</label><input data-key="swimSummary.maxHR" type="number"></div>
      <div class="field"><label>Active Calories</label><input data-key="swimSummary.calories" type="number"></div>
      <div class="field"><label>Session RPE</label><input data-key="swimSummary.rpe" type="number" min="0" max="10"></div>
      <div class="field"><label>腿部疲劳</label><input data-key="swimSummary.legFatigue" type="number" min="0" max="10"></div>
      <div class="field"><label>肩部疲劳</label><input data-key="swimSummary.shoulderFatigue" type="number" min="0" max="10"></div>
    </div></div>`;
  }
  if(!t.exercises && !t.swim){
    html+=`<div class="card"><label class="checkline"><input type="checkbox" data-key="rest.completed"><span>完整休息 / 轻量活动</span></label></div>`;
  }
  html+=`</div>`;
  qs("#workoutContainer").innerHTML=html;
  attachInputListeners();
}
function renderMobility(){
  qs("#mobilityList").innerHTML=mobility.map((m,i)=>`<label class="checkline"><input type="checkbox" data-key="mobility.${i}"><span>${m}</span></label>`).join("");
  attachInputListeners();
}
function attachInputListeners(){
  qsa("[data-key]").forEach(el=>{
    el.oninput=el.onchange=()=>{ 
      setPath(draft,el.dataset.key,el.type==="checkbox"?el.checked:el.value);
      saveDraft();
      if(el.dataset.key==="swimSummary.distance"||el.dataset.key==="swimSummary.time") calcPace();
      updateExerciseDone();
    };
  });
}
function hydrateInputs(){
  qsa("[data-key]").forEach(el=>{
    const v=getPath(draft,el.dataset.key);
    if(el.type==="checkbox") el.checked=!!v;
    else el.value=v??"";
  });
  calcPace(false);
  updateExerciseDone();
}
function saveAllInputs(){
  qsa("[data-key]").forEach(el=>setPath(draft,el.dataset.key,el.type==="checkbox"?el.checked:el.value));
  saveDraft();
}
function calcPace(write=true){
  const dist=parseFloat(getPath(draft,"swimSummary.distance"));
  const time=parseFloat(getPath(draft,"swimSummary.time"));
  if(dist>0&&time>0){
    const pace=time*60/dist*100;
    const m=Math.floor(pace/60), s=Math.round(pace%60).toString().padStart(2,"0");
    if(write){setPath(draft,"swimSummary.pace",`${m}:${s}`);saveDraft();}
    const el=qs('[data-key="swimSummary.pace"]'); if(el) el.value=`${m}:${s}`;
  }
}
function updateExerciseDone(){
  const t=templates[currentDay];
  if(!t.exercises)return;
  t.exercises.forEach((e,i)=>{
    const sets=getPath(draft,`ex.${i}.sets`)||{};
    let n=0; for(let s=0;s<e[2];s++) if(sets[s]?.done)n++;
    const el=qs(`#done-${i}`); if(el) el.textContent=n?`${n}/${e[2]} ✓`:"";
  });
}
function saveSession(){
  saveAllInputs();
  const date=qs("#sessionDate").value;
  const sessions=getSessions().filter(s=>!(s.date===date&&s.day===currentDay));
  sessions.push({id:Date.now(),date,day:currentDay,label:templates[currentDay].label,data:draft,savedAt:new Date().toISOString()});
  localStorage.setItem("fitness.sessions",JSON.stringify(sessions));
  alert("已保存");
  renderWeek(); renderHistory();
}
function getSessions(){try{return JSON.parse(localStorage.getItem("fitness.sessions")||"[]")}catch{return[]}}
function clearCurrent(){
  if(!confirm("清空当前日期和训练日的未保存数据？"))return;
  localStorage.removeItem(draftKey()); draft={}; render();
}
function startOfWeek(d=new Date()){
  const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x;
}
function endOfWeek(d=new Date()){const x=startOfWeek(d);x.setDate(x.getDate()+6);return x}
function renderWeek(){
  const start=startOfWeek(), end=endOfWeek();
  qs("#weekRange").textContent=`${localDateISO(start)} – ${localDateISO(end)}`;
  const sessions=getSessions().filter(s=>{const d=new Date(s.date+"T12:00:00");return d>=start&&d<=new Date(end.getTime()+86400000-1)});
  qs("#weekSessions").textContent=sessions.length;
  const nums=(path)=>sessions.map(s=>parseFloat(getPath(s.data,path))).filter(Number.isFinite);
  const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:null;
  qs("#weekMinutes").textContent=Math.round(sum(nums("post.duration")));
  qs("#weekCalories").textContent=Math.round(sum(nums("post.calories")));
  qs("#weekDistance").textContent=Math.round(sum(nums("swimSummary.distance")));
  const r=avg(nums("post.rpe")); qs("#weekRPE").textContent=r===null?"—":r.toFixed(1);
  const w=avg(nums("pre.bodyWeight")); qs("#weekWeight").textContent=w===null?"—":w.toFixed(1);
  const pct=Math.min(100,Math.round(sessions.length/5*100)); qs("#weekPercent").textContent=pct+"%"; qs("#weekProgress").style.width=pct+"%";
}
function renderHistory(){
  const sessions=getSessions().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  qs("#historyCount").textContent=`${sessions.length} sessions`;
  qs("#historyList").innerHTML=sessions.length?sessions.map(s=>{
    const d=s.data, dur=getPath(d,"post.duration")||"—", rpe=getPath(d,"post.rpe")||"—", dist=getPath(d,"swimSummary.distance");
    return `<div class="history-item"><div><strong>${esc(s.label)}</strong><div class="muted tiny">${esc(s.date)}${dist?` · ${esc(dist)} yd`:""}</div></div><div style="text-align:right"><div>${esc(dur)} min</div><div class="muted tiny">RPE ${esc(rpe)}</div><button class="btn tiny" onclick="deleteSession(${s.id})" style="margin-top:6px;padding:5px 8px">删除</button></div></div>`
  }).join(""):`<div class="muted">还没有保存训练。</div>`;
}
window.deleteSession=function(id){
  if(!confirm("删除这条训练记录？"))return;
  localStorage.setItem("fitness.sessions",JSON.stringify(getSessions().filter(s=>s.id!==id)));
  renderHistory();renderWeek();
}
function exportData(){
  const payload={version:1,exportedAt:new Date().toISOString(),sessions:getSessions()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`training-backup-${localDateISO()}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importData(file){
  const r=new FileReader();r.onload=()=>{
    try{
      const x=JSON.parse(r.result); if(!Array.isArray(x.sessions)) throw 0;
      localStorage.setItem("fitness.sessions",JSON.stringify(x.sessions)); renderWeek();renderHistory();alert("导入完成");
    }catch{alert("文件格式不正确")}
  };r.readAsText(file);
}
function resetAll(){
  if(!confirm("确定删除所有训练记录和草稿？此操作不可撤销。"))return;
  Object.keys(localStorage).filter(k=>k.startsWith("fitness.")).forEach(k=>localStorage.removeItem(k));
  currentDay=dayFromWeekday();draft={};render();renderWeek();renderHistory();
}
function init(){
  qs("#todayLabel").textContent=new Intl.DateTimeFormat("zh-CN",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(new Date());
  qs("#sessionDate").value=localDateISO();
  qs("#sessionDate").onchange=()=>{saveAllInputs();loadDraft();render();};
  loadDraft(); render(); renderWeek(); renderHistory();
  qs("#saveSessionBtn").onclick=saveSession; qs("#saveBottomBtn").onclick=saveSession; qs("#clearCurrentBtn").onclick=clearCurrent;
  qs("#exportBtn").onclick=exportData; qs("#importFile").onchange=e=>e.target.files[0]&&importData(e.target.files[0]); qs("#resetAllBtn").onclick=resetAll;
  qsa(".navbtn").forEach(b=>b.onclick=()=>{
    qsa(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");
    qsa(".panel").forEach(x=>x.classList.remove("active"));qs("#"+b.dataset.panel).classList.add("active");
    if(b.dataset.panel==="weekPanel")renderWeek(); if(b.dataset.panel==="historyPanel")renderHistory();
  });
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
init();
</script>
</body>
</html>
